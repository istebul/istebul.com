# PR #159 deploy checklist: migration → edge → verify → smoke
name: Vertical Partner Dispatch Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy from
        required: false
        default: cursor/vertical-partner-dispatch-3f21

concurrency:
  group: vertical-partner-dispatch-deploy
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: hjfrcdstbyonmgatgwcc

jobs:
  deploy:
    name: Migration + Edge + Verify + Smoke
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'cursor/vertical-partner-dispatch-3f21' }}

      - name: Require Supabase token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN not set"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: 2.104.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Push database migrations (include-all)
        run: |
          if [ -n "$SUPABASE_DATABASE_URL" ]; then
            supabase db push --yes --include-all --db-url "$SUPABASE_DATABASE_URL"
          else
            supabase db push --yes --include-all
          fi

      - name: Verify vertical partner dispatch schema
        run: node scripts/verify-vertical-partner-dispatch-schema.cjs

      - name: Deploy vertical edge functions
        run: |
          FUNCTIONS=(
            housing-intake
            vacation-intake
            sigorta-intake
            vertical-intake
            kasko-intake
            partner-dispatch
            partner-retry
          )
          for fn in "${FUNCTIONS[@]}"; do
            echo "Deploying $fn..."
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
          done

      - name: Production smoke (vertical leads + dispatch)
        if: env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: node scripts/vertical-partner-dispatch-smoke.cjs

      - name: Smoke skipped notice
        if: env.SUPABASE_SERVICE_ROLE_KEY == ''
        run: echo "::warning::SUPABASE_SERVICE_ROLE_KEY not set — skipping production smoke"
