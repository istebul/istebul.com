name: Partner Retry

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Supabase partner retry
        env:
          PARTNER_RETRY_URL: ${{ secrets.PARTNER_RETRY_URL }}
          PARTNER_RETRY_SECRET: ${{ secrets.PARTNER_RETRY_SECRET }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          RESPONSE_FILE="/tmp/partner-retry-response.txt"
          MAX_ATTEMPTS=3
          RETRY_DELAY=10

          log_response_snippet() {
            if [ -s "$RESPONSE_FILE" ]; then
              head -c 2000 "$RESPONSE_FILE" || true
              echo ""
            fi
          }

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Partner retry attempt ${attempt}/${MAX_ATTEMPTS}..."

            http_code="$(
              curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" -X POST "$PARTNER_RETRY_URL" \
                -H "apikey: $SUPABASE_ANON_KEY" \
                -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
                -H "x-retry-secret: $PARTNER_RETRY_SECRET"
            )"

            echo "HTTP status: ${http_code}"

            case "$http_code" in
              200|204)
                echo "Partner retry succeeded."
                log_response_snippet
                exit 0
                ;;
              403)
                echo "::error::Partner retry forbidden — config/secret mismatch likely (verify PARTNER_RETRY_SECRET matches Supabase RETRY_WORKER_SECRET)."
                log_response_snippet
                exit 1
                ;;
              500)
                echo "::error::Partner retry failed — edge function handler/runtime error likely."
                log_response_snippet
                exit 1
                ;;
              502|503|504)
                echo "Transient gateway status ${http_code}."
                log_response_snippet
                if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
                  echo "Retrying in ${RETRY_DELAY}s..."
                  sleep "$RETRY_DELAY"
                else
                  echo "::error::Partner retry failed after ${MAX_ATTEMPTS} attempts — gateway/boot/transient failure likely (HTTP ${http_code})."
                  exit 1
                fi
                ;;
              *)
                echo "::error::Partner retry failed with unexpected HTTP ${http_code}."
                log_response_snippet
                exit 1
                ;;
            esac
          done
