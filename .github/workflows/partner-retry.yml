name: Partner Retry

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  retry:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: hjfrcdstbyonmgatgwcc
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Sync retry secret to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PARTNER_RETRY_SECRET: ${{ secrets.PARTNER_RETRY_SECRET }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN missing; RETRY_WORKER_SECRET sync skipped"
          elif [ -z "$PARTNER_RETRY_SECRET" ]; then
            echo "::error::PARTNER_RETRY_SECRET missing"
            exit 1
          else
            supabase secrets set RETRY_WORKER_SECRET="$PARTNER_RETRY_SECRET" --project-ref "$SUPABASE_PROJECT_REF"
            echo "::notice::RETRY_WORKER_SECRET synced from PARTNER_RETRY_SECRET"
          fi

      - name: Trigger Supabase partner retry
        env:
          PARTNER_RETRY_URL: ${{ secrets.PARTNER_RETRY_URL }}
          PARTNER_RETRY_SECRET: ${{ secrets.PARTNER_RETRY_SECRET }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$PARTNER_RETRY_URL" ] || [ -z "$PARTNER_RETRY_SECRET" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Required secret is missing (PARTNER_RETRY_URL / PARTNER_RETRY_SECRET / SUPABASE_ANON_KEY)"
            exit 1
          fi
          invoke_retry() {
            local status
            status="$(curl -sS -o /tmp/partner-retry-body.txt -w "%{http_code}" -X POST "$PARTNER_RETRY_URL" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H "x-retry-secret: $PARTNER_RETRY_SECRET" || true)"
            echo "HTTP_STATUS=$status"
            [ "$status" = "200" ]
          }

          if invoke_retry; then
            echo "::notice::Partner retry trigger succeeded"
            exit 0
          fi

          echo "::warning::First retry trigger failed. Body:"
          cat /tmp/partner-retry-body.txt || true

          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::Re-syncing RETRY_WORKER_SECRET and retrying..."
            supabase secrets set RETRY_WORKER_SECRET="$PARTNER_RETRY_SECRET" --project-ref "$SUPABASE_PROJECT_REF"
            sleep 5
            if invoke_retry; then
              echo "::notice::Partner retry trigger succeeded after secret re-sync"
              exit 0
            fi
          else
            echo "::warning::SUPABASE_ACCESS_TOKEN missing; cannot self-heal by re-syncing secret"
          fi

          echo "::error::Partner retry trigger failed after automated recovery"
          cat /tmp/partner-retry-body.txt || true
          exit 1
