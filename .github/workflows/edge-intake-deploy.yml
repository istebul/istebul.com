# Targeted deploy for housing-intake + vacation-intake (funnel P0 allowlist updates)
name: Edge Intake Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy from
        required: false
        default: cursor/funnel-validation-p0-3f21

concurrency:
  group: edge-intake-deploy
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: hjfrcdstbyonmgatgwcc

jobs:
  deploy-edge-intake:
    name: Deploy housing-intake + vacation-intake
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'cursor/funnel-validation-p0-3f21' }}

      - name: Skip if no Supabase token
        id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::error::SUPABASE_ACCESS_TOKEN not set"
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v3
        with:
          version: 2.104.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Deploy housing-intake
        run: supabase functions deploy housing-intake --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy vacation-intake
        run: supabase functions deploy vacation-intake --project-ref "$SUPABASE_PROJECT_REF"
