name: CEO Alerts (P13)

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

jobs:
  ceo-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Run CEO alerting (early intervention)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPS_ALERT_DIGEST_URL: ${{ secrets.OPS_ALERT_DIGEST_URL }}
          OPS_ALERT_WEBHOOK_SECRET: ${{ secrets.OPS_ALERT_WEBHOOK_SECRET }}
        run: npm run ceo:alerts:run
      - name: Upload CEO alert artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ceo-alerts-${{ github.run_id }}
          path: |
            dist/ceo-alerts-snapshot.json
            dist/ceo-alerts-report.json
          if-no-files-found: ignore
