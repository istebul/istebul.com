name: Analytics Retention (P19)

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  purge-analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Purge analytics_events older than retention window
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RETENTION_DAYS: "90"
        run: node scripts/analytics-retention-purge.cjs
