# Otomatik production deploy: main push → test → Cloudflare Pages → Supabase
name: Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CF_PAGES_PROJECT: istebul-com
  SUPABASE_PROJECT_REF: hjfrcdstbyonmgatgwcc

jobs:
  quality:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Go-live verification (build, audits, unit router suite)
        run: npm run go-live:verify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: E2E release gate (site health + user flows)
        run: |
          npx playwright install chromium --with-deps
          npm run test:e2e:release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

  deploy-edge-intake:
    name: Edge intake (housing + vacation)
    needs: quality
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: hjfrcdstbyonmgatgwcc
    steps:
      - uses: actions/checkout@v7

      - name: Skip if no Supabase token
        id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::SUPABASE_ACCESS_TOKEN not set — skipping edge intake deploy"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v3
        if: steps.gate.outputs.skip != 'true'
        with:
          version: 2.104.0

      - name: Link Supabase project
        if: steps.gate.outputs.skip != 'true'
        run: bash scripts/lib/retry-command.sh supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Deploy housing-intake
        if: steps.gate.outputs.skip != 'true'
        run: bash scripts/lib/retry-command.sh supabase functions deploy housing-intake --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy vacation-intake
        if: steps.gate.outputs.skip != 'true'
        run: bash scripts/lib/retry-command.sh supabase functions deploy vacation-intake --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy ai-listings-intake
        if: steps.gate.outputs.skip != 'true'
        run: bash scripts/lib/retry-command.sh supabase functions deploy ai-listings-intake --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy partner-endpoint-test (CORS hotfix path)
        if: steps.gate.outputs.skip != 'true'
        run: bash scripts/lib/retry-command.sh supabase functions deploy partner-endpoint-test --project-ref "$SUPABASE_PROJECT_REF"

  deploy-cloudflare:
    name: Cloudflare Pages
    needs: [quality, deploy-edge-intake]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check Cloudflare deploy credentials
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          ready=1
          for name in CF_TOKEN CF_ACCOUNT SB_URL SB_KEY; do
            if [ -z "${!name}" ]; then
              echo "::warning::Missing secret $name — see .github/SECRETS.example.md"
              ready=0
            fi
          done
          if [ "$ready" = "1" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping GitHub→Cloudflare deploy. Cloudflare Git bağlantısı varsa push yine de canlıya alınır."
          fi

      - name: Production build
        if: steps.cf.outputs.deploy == 'true'
        run: npm run build
        env:
          REQUIRE_SUPABASE_ENV: '1'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
          GA4_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          LOGROCKET_APP_ID: ${{ secrets.LOGROCKET_APP_ID }}

      - name: Verify dist/env.js Supabase config
        if: steps.cf.outputs.deploy == 'true'
        run: |
          node -e "
            const fs = require('fs');
            const src = fs.readFileSync('dist/env.js', 'utf8');
            if (!src.includes('SUPABASE_URL') || !/SUPABASE_ANON_KEY\":\"[^\"]+\"/.test(src)) {
              console.error('dist/env.js is missing SUPABASE_URL or SUPABASE_ANON_KEY');
              process.exit(1);
            }
            console.log('dist/env.js Supabase config OK');
          "

      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CF_PAGES_PROJECT }} --branch=main

  apply-cloudflare-bot-access:
    name: Cloudflare bot access (WAF skip rules)
    needs: deploy-cloudflare
    runs-on: ubuntu-latest
    if: needs.deploy-cloudflare.result == 'success'
    steps:
      - uses: actions/checkout@v7
      - name: Apply WAF skip rules (verified bots + smoke UA)
        run: node scripts/apply-cloudflare-bot-access.cjs --apply
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_PAGES_PROJECT: ${{ env.CF_PAGES_PROJECT }}

  deploy-supabase:
    name: Supabase (migrations + edge)
    needs: quality
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      SUPABASE_PROJECT_REF: hjfrcdstbyonmgatgwcc
    steps:
      - uses: actions/checkout@v7

      - name: Skip if no Supabase token
        id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::SUPABASE_ACCESS_TOKEN not set — skipping Supabase deploy"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply analytics ITE schema (Management API, idempotent)
        id: analytics_ite_schema
        if: steps.gate.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          bash scripts/apply-analytics-ite-migration-api.sh

      - name: Apply posts schema (Management API, idempotent)
        id: posts_schema
        if: steps.gate.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          bash scripts/apply-posts-schema-migration-api.sh

      - name: Verify analytics_exclusion_rules table
        if: steps.gate.outputs.skip != 'true' && steps.analytics_ite_schema.outcome == 'success'
        run: node scripts/verify-analytics-exclusion-schema.cjs

      - name: Verify posts schema columns
        if: steps.gate.outputs.skip != 'true' && steps.posts_schema.outcome == 'success'
        run: node scripts/verify-posts-content-type-schema.cjs

      - name: Require analytics ITE schema
        if: steps.gate.outputs.skip != 'true'
        run: |
          if [ "${{ steps.analytics_ite_schema.outcome }}" != "success" ]; then
            echo "::error::analytics_exclusion_rules could not be created — check Management API token"
            exit 1
          fi
          if [ "${{ steps.posts_schema.outcome }}" != "success" ]; then
            echo "::error::posts schema (content_type, cover_image_url, …) could not be applied — check Management API token"
            exit 1
          fi

      - uses: supabase/setup-cli@v3
        id: setup_supabase_cli
        continue-on-error: true
        if: steps.gate.outputs.skip != 'true'
        with:
          version: 2.104.0

      - name: Install Supabase CLI fallback
        if: steps.gate.outputs.skip != 'true' && steps.setup_supabase_cli.outcome != 'success'
        run: npm install -g supabase@2.104.0

      - name: Verify Supabase CLI parses config.toml
        if: steps.gate.outputs.skip != 'true'
        run: |
          supabase --version
          test -f supabase/config.toml

      - name: Link Supabase project
        if: steps.gate.outputs.skip != 'true'
        run: bash scripts/lib/retry-command.sh supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Push database migrations
        id: db_push
        continue-on-error: true
        if: steps.gate.outputs.skip != 'true'
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          # Latest Supabase CLI can push via SUPABASE_ACCESS_TOKEN (password-less DB role).
          # Optional: SUPABASE_DB_PASSWORD or SUPABASE_DATABASE_URL for explicit connection.
          if [ -n "$SUPABASE_DATABASE_URL" ]; then
            supabase db push --yes --include-all --db-url "$SUPABASE_DATABASE_URL"
          else
            supabase db push --yes --include-all
          fi

      - name: Apply Konut/Finans schema fallback (Management API)
        id: vertical_schema_fallback
        if: steps.db_push.outcome == 'failure' && steps.gate.outputs.skip != 'true'
        run: bash scripts/apply-vertical-migration-api.sh

      - name: Apply vertical partner dispatch schema fallback (Management API)
        id: vpd_schema_fallback
        if: steps.db_push.outcome == 'failure' && steps.gate.outputs.skip != 'true'
        run: bash scripts/apply-vertical-partner-dispatch-migration-api.sh

      - name: Apply AI listings schema fallback (Management API)
        id: ai_listings_schema_fallback
        if: steps.db_push.outcome == 'failure' && steps.gate.outputs.skip != 'true'
        run: bash scripts/apply-ai-listings-migration-api.sh

      - name: Apply WarehouseIQ schema fallback (Management API)
        id: warehouse_schema_fallback
        if: steps.db_push.outcome == 'failure' && steps.gate.outputs.skip != 'true'
        run: bash scripts/apply-warehouse-migrations-api.sh

      - name: Verify WarehouseIQ schema
        if: steps.gate.outputs.skip != 'true'
        run: bash scripts/apply-warehouse-migrations-api.sh --verify-only

      - name: Verify vertical partner dispatch schema
        if: steps.gate.outputs.skip != 'true'
        run: node scripts/verify-vertical-partner-dispatch-schema.cjs

      - name: Require Konut/Finans schema
        if: steps.gate.outputs.skip != 'true'
        run: |
          if [ "${{ steps.db_push.outcome }}" != "success" ] && [ "${{ steps.vertical_schema_fallback.outcome }}" != "success" ] && [ "${{ steps.vpd_schema_fallback.outcome }}" != "success" ]; then
            echo "::error::Database migrations failed and schema fallbacks did not run."
            exit 1
          fi
          if [ "${{ steps.db_push.outcome }}" != "success" ]; then
            echo "::warning::db push incomplete (migration history drift). Schema applied via Management API fallback where available."
          fi

      - name: Sync edge secrets (analytics ITE)
        if: steps.gate.outputs.skip != 'true'
        env:
          ANALYTICS_HASH_SALT: ${{ secrets.ANALYTICS_HASH_SALT }}
        run: |
          if [ -n "$ANALYTICS_HASH_SALT" ]; then
            supabase secrets set ANALYTICS_HASH_SALT="$ANALYTICS_HASH_SALT" --project-ref "$SUPABASE_PROJECT_REF"
            echo "ANALYTICS_HASH_SALT synced to edge"
          else
            echo "::warning::Set GitHub secret ANALYTICS_HASH_SALT for internal traffic exclusion hashing"
          fi

      - name: Sync AI listings edge secrets
        if: steps.gate.outputs.skip != 'true'
        env:
          AI_LISTINGS_EDGE_SECRET: ${{ secrets.AI_LISTINGS_EDGE_SECRET }}
        run: |
          supabase secrets set AI_LISTINGS_SUPABASE_ENABLED=true --project-ref "$SUPABASE_PROJECT_REF"
          supabase secrets set AI_LISTINGS_PUBLIC_PUBLISH_ENABLED=true --project-ref "$SUPABASE_PROJECT_REF"
          if [ -z "$AI_LISTINGS_EDGE_SECRET" ]; then
            echo "::error::AI_LISTINGS_EDGE_SECRET is required for production deploy"
            exit 1
          fi
          supabase secrets set AI_LISTINGS_EDGE_SECRET="$AI_LISTINGS_EDGE_SECRET" --project-ref "$SUPABASE_PROJECT_REF"
          echo "AI listings edge secrets synced"

      - name: Deploy edge functions
        if: steps.gate.outputs.skip != 'true'
        run: |
          command -v supabase >/dev/null || { echo "::error::supabase CLI not available"; exit 1; }
          FUNCTIONS=(
            auto-intake
            housing-intake
            finance-intake
            sigorta-intake
            vacation-intake
            vertical-intake
            kasko-intake
            support-intake
            analytics-ingest
            admin-action
            user-account
            ops-ingest
            lifecycle-enroll
            lifecycle-cron
            warehouse-cycle-count-cron
            partner-retry
            partner-dispatch
            partner-endpoint-test
            partner-callback
            partner-application
            partner-onboarding
            decision-intelligence
            outcome-capture
            moat-health
            lead-alert
            partner-daily-reset
            create-payment-session
            iyzico-webhook
            paytr-create-payment-session
            paytr-webhook
            payment-provider-status
            ai-listings
            ai-listings-intake
          )
          for fn in "${FUNCTIONS[@]}"; do
            echo "Deploying $fn..."
            bash scripts/lib/retry-command.sh supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
          done

      - name: Edge function smoke guard
        if: steps.gate.outputs.skip != 'true'
        run: node scripts/smoke-edge-functions.cjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

  smoke-live:
    name: Live smoke (post-deploy)
    needs: [deploy-cloudflare]
    runs-on: ubuntu-latest
    if: needs.deploy-cloudflare.result == 'success'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Wait for CDN propagation
        run: sleep 45
      - name: HTTP smoke www
        run: npm run smoke:live:strict -- https://www.istebul.com

      - name: Bot access verification
        run: node scripts/verify-bot-access.cjs https://www.istebul.com
        continue-on-error: true

  deploy-report:
    name: Deploy summary
    needs: [quality, deploy-cloudflare, deploy-supabase, smoke-live]
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main' && needs.quality.result == 'success'
    steps:
      - name: Summary
        run: |
          {
            echo "## Production Deploy özeti"
            echo ""
            echo "| Job | Sonuç |"
            echo "|-----|--------|"
            echo "| Test & Build | ${{ needs.quality.result }} |"
            echo "| Cloudflare Pages | ${{ needs.deploy-cloudflare.result }} |"
            echo "| Supabase | ${{ needs.deploy-supabase.result }} |"
            echo "| Live smoke | ${{ needs.smoke-live.result }} |"
            echo ""
            echo "Sigorta canlı URL: https://www.istebul.com/sigorta/"
            echo "GSC: sitemap https://www.istebul.com/sitemap.xml"
            echo ""
            echo "Cloudflare **skipped** ise: repo **Secrets** → \`CLOUDFLARE_API_TOKEN\`, \`CLOUDFLARE_ACCOUNT_ID\`, \`SUPABASE_URL\`, \`SUPABASE_ANON_KEY\`"
            echo ""
            echo "Rehber: [docs/CANLIYA_ALMA_REHBERI.md](https://github.com/${{ github.repository }}/blob/main/docs/CANLIYA_ALMA_REHBERI.md)"
          } >> "$GITHUB_STEP_SUMMARY"
