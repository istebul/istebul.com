# Otomatik production deploy: main push → test → Cloudflare Pages → Supabase
name: Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  CF_PAGES_PROJECT: istebul-com
  SUPABASE_PROJECT_REF: hjfrcdstbyonmgatgwcc

jobs:
  quality:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run test

  deploy-cloudflare:
    name: Cloudflare Pages
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check Cloudflare deploy credentials
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          ready=1
          for name in CF_TOKEN CF_ACCOUNT SB_URL SB_KEY; do
            if [ -z "${!name}" ]; then
              echo "::warning::Missing secret $name — see .github/SECRETS.example.md"
              ready=0
            fi
          done
          if [ "$ready" = "1" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping GitHub→Cloudflare deploy. Cloudflare Git bağlantısı varsa push yine de canlıya alınır."
          fi

      - name: Production build
        if: steps.cf.outputs.deploy == 'true'
        run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          LOGROCKET_APP_ID: ${{ secrets.LOGROCKET_APP_ID }}

      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CF_PAGES_PROJECT }} --branch=main

  deploy-supabase:
    name: Supabase (migrations + edge)
    needs: quality
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: hjfrcdstbyonmgatgwcc
    steps:
      - uses: actions/checkout@v4

      - name: Skip if no Supabase token
        id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::SUPABASE_ACCESS_TOKEN not set — skipping Supabase deploy"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.skip != 'true'
        with:
          version: latest

      - name: Link Supabase project
        if: steps.gate.outputs.skip != 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Push database migrations
        if: steps.gate.outputs.skip != 'true'
        run: |
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            supabase db push --yes
          else
            echo "::notice::SUPABASE_DB_PASSWORD not set — skipping migrations"
          fi

      - name: Deploy edge functions
        if: steps.gate.outputs.skip != 'true'
        run: |
          FUNCTIONS=(
            auto-intake
            analytics-ingest
            ops-ingest
            lifecycle-enroll
            lifecycle-cron
            partner-retry
            partner-dispatch
            partner-callback
            partner-application
            partner-onboarding
            decision-intelligence
            outcome-capture
            moat-health
            lead-alert
            admin-action
            partner-daily-reset
            vacation-intake
            vertical-intake
          )
          for fn in "${FUNCTIONS[@]}"; do
            echo "Deploying $fn..."
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
          done

  deploy-report:
    name: Deploy summary
    needs: [quality, deploy-cloudflare, deploy-supabase]
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - name: Summary
        run: |
          {
            echo "## Production Deploy özeti"
            echo ""
            echo "| Job | Sonuç |"
            echo "|-----|--------|"
            echo "| Test & Build | ${{ needs.quality.result }} |"
            echo "| Cloudflare Pages | ${{ needs.deploy-cloudflare.result }} |"
            echo "| Supabase | ${{ needs.deploy-supabase.result }} |"
            echo ""
            echo "Cloudflare **skipped** ise: repo **Secrets** → \`CLOUDFLARE_API_TOKEN\`, \`CLOUDFLARE_ACCOUNT_ID\`, \`SUPABASE_URL\`, \`SUPABASE_ANON_KEY\`"
            echo ""
            echo "Rehber: [docs/CANLIYA_ALMA_REHBERI.md](https://github.com/${{ github.repository }}/blob/main/docs/CANLIYA_ALMA_REHBERI.md)"
          } >> "$GITHUB_STEP_SUMMARY"
