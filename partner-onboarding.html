<html lang="tr">
<head>

  <title>Yönlendiriliyor… | isteBul Partner</title>
  <meta name="robots" content="noindex,nofollow">
  <script>
    (function () {
      var params = new URLSearchParams(location.search || '');
      var token = params.get('token');
      if (!token) {
        location.replace('/partner-basvuru.html');
        return;
      }
      var step = params.get('step') || '2';
      var next = new URLSearchParams({ token: token, step: step });
      location.replace('/partner-basvuru.html?' + next.toString());
    })();
  </script>
</head>
