<!doctype html>
<html lang="tr" class="ib-ds-v4 ib-premium-v7">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ea580c">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/assets/brand/istebul-icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/assets/icons/favicon-192.png">
  <title>Rezervasyon | GarsonAI — isteBul</title>
  <meta name="description" content="GarsonAI ile restoran rezervasyonu. Tarih, saat ve kişi sayısı özetiyle rezervasyonunuzu tamamlayın.">
  <meta name="robots" content="noindex, follow">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/perf-fonts.css?v=1" media="all">
  <noscript><link rel="stylesheet" href="/css/perf-fonts.css?v=1"></noscript>
  <link rel="stylesheet" href="/css/tatil.css">
  <link rel="stylesheet" href="/css/vertical-themes.css">
  <link rel="stylesheet" href="/css/restoran-page.css">
  <script src="/env.js" defer></script>
  <script type="module" src="/js/restoran/reservation-page.js"></script>
</head>
<body class="vacation-page restoran-page reservation-page">
  <header class="vacation-header ib-vertical-header ib-vertical-header--restoran">
    <a class="logo ib-vertical-brand" href="/" aria-label="isteBul ana sayfa">
      <img class="ib-vertical-brand__icon" src="/assets/brand/istebul-icon.svg" alt="" width="28" height="28" decoding="async">
      <span class="ib-vertical-brand__word">isteBul</span>
      <span class="ib-vertical-brand__badge">GarsonAI</span>
    </a>
    <nav id="reservation-nav" aria-label="Ana navigasyon">
      <div class="ib-vertical-nav-primary">
        <a href="/">Ana sayfa</a>
        <a href="/restoran/">Restoran keşfi</a>
      </div>
    </nav>
  </header>

  <div class="vacation-container vacation-container--breadcrumb">
    <nav class="vacation-breadcrumb" aria-label="Breadcrumb">
      <a href="/">Ana sayfa</a> ›
      <a href="/restoran/">Restoran keşfi</a> ›
      <span>Rezervasyon</span>
    </nav>
  </div>

  <main class="vacation-container reservation-main" id="reservation-main">
    <div id="reservation-status" class="restoran-status restoran-status--loading" hidden role="status" aria-live="polite">
      Restoran bilgileri yükleniyor…
    </div>

    <section class="restoran-search-panel reservation-panel" id="reservation-panel" hidden aria-labelledby="reservation-title">
      <p class="restoran-search-panel__lead">GarsonAI rezervasyon özeti</p>
      <h1 id="reservation-title" class="reservation-panel__title">Rezervasyon</h1>

      <dl class="reservation-summary">
        <div class="reservation-summary__row">
          <dt>Adres</dt>
          <dd id="reservation-address">—</dd>
        </div>
        <div class="reservation-summary__row">
          <dt>Masa durumu</dt>
          <dd><span class="restoran-card__badge" id="reservation-availability">—</span></dd>
        </div>
        <div class="reservation-summary__row">
          <dt>Seçiminiz</dt>
          <dd id="reservation-context-summary">—</dd>
        </div>
      </dl>

      <div class="reservation-actions">
        <button type="button" class="btn btn-primary" id="reservation-confirm-btn" disabled aria-disabled="true">
          Rezervasyonu onayla (yakında)
        </button>
        <a class="btn reservation-back-link" href="/restoran/">Başka restoran ara</a>
      </div>
    </section>

    <section
      class="restoran-search-panel reservation-fallback"
      id="reservation-fallback"
      hidden
      aria-labelledby="reservation-fallback-title"
    >
      <h1 id="reservation-fallback-title" class="reservation-panel__title">Rezervasyon</h1>
      <p id="reservation-fallback-text" class="restoran-search-panel__lead"></p>
      <dl class="reservation-summary">
        <div class="reservation-summary__row">
          <dt>Seçiminiz</dt>
          <dd id="reservation-context-summary-fallback">—</dd>
        </div>
      </dl>
      <div class="reservation-actions">
        <a class="btn btn-primary" href="/restoran/">Restoran keşfine dön</a>
      </div>
    </section>
  </main>
</body>
</html>
