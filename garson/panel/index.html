<!doctype html>
<html lang="tr" class="ib-ds-v4 ib-premium-v7">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b14">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/assets/brand/istebul-icon.svg">
  <title>GarsonAI Panel | isteBul</title>
  <meta name="description" content="GarsonAI restoran yönetim paneli — operasyon merkezi.">
  <meta name="robots" content="noindex, follow">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/perf-fonts.css?v=1" media="all">
  <noscript><link rel="stylesheet" href="/css/perf-fonts.css?v=1"></noscript>
  <link rel="stylesheet" href="/css/garsonai-design-system-v1.css">
  <link rel="stylesheet" href="/css/garsonai-admin-v1.css">
  <script src="/env.js" defer></script>
  <script type="module" src="/js/restoran/admin/bootstrap.js"></script>
</head>
<body class="garsonai-page garsonai-admin-page garson-admin-page">
  <div class="gai-admin-shell" data-admin-page="dashboard">
    <aside class="gai-admin-sidebar" aria-label="Panel menüsü">
      <a class="gai-admin-sidebar__brand" href="/garson/">
        <img class="gai-admin-sidebar__logo" src="/assets/brand/istebul-icon.svg" alt="" width="32" height="32" decoding="async">
        <span class="gai-admin-sidebar__title"><span>isteBul</span> <span>GarsonAI</span></span>
      </a>
      <nav class="gai-admin-nav" data-admin-nav aria-label="Modüller"></nav>
      <div class="gai-admin-sidebar__footer">
        <a class="gai-btn gai-btn--secondary gai-btn--sm" href="/garson/zeka/">Zeka merkezi</a>
        <button type="button" class="gai-btn gai-btn--ghost gai-btn--sm" data-admin-logout>Çıkış yap</button>
      </div>
    </aside>
    <main class="gai-admin-main" id="garson-admin-panel">
      <span id="garson-admin-demo-badge" class="gai-badge gai-badge--warning" hidden>Demo modu</span>
      <div data-admin-content aria-live="polite"></div>
      <section id="garson-admin-stats" class="gai-admin-stats-placeholder" hidden aria-hidden="true"></section>
      <div id="garson-admin-sections" hidden aria-hidden="true"></div>
    </main>
  </div>
</body>
</html>
