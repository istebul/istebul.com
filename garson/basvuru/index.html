<!doctype html>
<html lang="tr" class="ib-ds-v4 ib-premium-v7">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ea580c">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/assets/brand/istebul-icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/assets/icons/favicon-192.png">
  <title>GarsonAI Başvuru | isteBul</title>
  <meta name="description" content="GarsonAI restoran başvuru formu — restoranınızı dijital garson platformuna taşıyın.">
  <meta name="robots" content="noindex, follow">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/perf-fonts.css?v=1" media="all">
  <noscript><link rel="stylesheet" href="/css/perf-fonts.css?v=1"></noscript>
  <link rel="stylesheet" href="/css/tatil.css">
  <link rel="stylesheet" href="/css/vertical-themes.css">
  <link rel="stylesheet" href="/css/restoran-page.css">
  <script src="/env.js" defer></script>
  <script type="module" src="/js/restoran/garson-launch.js"></script>
</head>
<body class="vacation-page restoran-page garson-launch-page">
  <header class="vacation-header ib-vertical-header ib-vertical-header--restoran">
    <a class="logo ib-vertical-brand" href="/garson/" aria-label="GarsonAI ana sayfa">
      <img class="ib-vertical-brand__icon" src="/assets/brand/istebul-icon.svg" alt="" width="28" height="28" decoding="async">
      <span class="ib-vertical-brand__word">isteBul</span>
      <span class="ib-vertical-brand__badge">GarsonAI</span>
    </a>
    <nav aria-label="GarsonAI navigasyonu">
      <div class="ib-vertical-nav-primary">
        <a href="/garson/">Ana sayfa</a>
        <a href="/garson/demo/">Demo</a>
      </div>
    </nav>
  </header>

  <main class="vacation-container garson-launch-main">
    <section class="garson-launch-hero garson-basvuru-hero" aria-labelledby="garson-basvuru-title">
      <p class="garson-launch-hero__eyebrow">Restoran başvurusu</p>
      <h1 id="garson-basvuru-title" class="garson-launch-hero__title">Restoranımı başlat</h1>
      <p class="garson-launch-hero__lead">
        Bilgilerinizi bırakın; GarsonAI ekibi sizinle iletişime geçsin.
      </p>
    </section>

    <form id="garson-basvuru-form" class="garson-launch-form" novalidate>
      <div class="garson-launch-form__field">
        <label for="garson-restaurant-name">Restoran adı</label>
        <input id="garson-restaurant-name" name="restaurant_name" type="text" required autocomplete="organization">
      </div>
      <div class="garson-launch-form__field">
        <label for="garson-contact-name">Yetkili kişi</label>
        <input id="garson-contact-name" name="contact_name" type="text" required autocomplete="name">
      </div>
      <div class="garson-launch-form__field">
        <label for="garson-phone">Telefon</label>
        <input id="garson-phone" name="phone" type="tel" required autocomplete="tel">
      </div>
      <div class="garson-launch-form__field">
        <label for="garson-email">E-posta</label>
        <input id="garson-email" name="email" type="email" required autocomplete="email">
      </div>
      <div class="garson-launch-form__field">
        <label for="garson-city">Şehir</label>
        <input id="garson-city" name="city" type="text" required autocomplete="address-level2">
      </div>
      <div class="garson-launch-form__field">
        <label for="garson-note">Not</label>
        <textarea id="garson-note" name="note" rows="4" placeholder="Kapasite, konsept veya özel istekleriniz"></textarea>
      </div>
      <button type="submit" class="vacation-btn vacation-btn--primary garson-launch-form__submit">Başvuruyu gönder</button>
    </form>

    <p id="garson-basvuru-success" class="garson-launch-form__success" hidden role="status" aria-live="polite">
      Başvurunuz alındı. En kısa sürede sizinle iletişime geçeceğiz.
    </p>
  </main>
</body>
</html>
