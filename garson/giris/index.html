<!doctype html>
<html lang="tr" class="ib-ds-v4 ib-premium-v7">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ea580c">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/assets/brand/istebul-icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/assets/icons/favicon-192.png">
  <title>GarsonAI Giriş | isteBul</title>
  <meta name="description" content="GarsonAI restoran yönetim paneline giriş yapın.">
  <meta name="robots" content="noindex, follow">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/perf-fonts.css?v=1" media="all">
  <noscript><link rel="stylesheet" href="/css/perf-fonts.css?v=1"></noscript>
  <link rel="stylesheet" href="/css/tatil.css">
  <link rel="stylesheet" href="/css/vertical-themes.css">
  <link rel="stylesheet" href="/css/restoran-page.css">
  <script src="/env.js" defer></script>
  <script type="module" src="/js/restoran/admin-portal.js"></script>
</head>
<body class="vacation-page restoran-page garson-admin-page garson-admin-login-page">
  <header class="vacation-header ib-vertical-header ib-vertical-header--restoran">
    <a class="logo ib-vertical-brand" href="/garson/" aria-label="GarsonAI ana sayfa">
      <img class="ib-vertical-brand__icon" src="/assets/brand/istebul-icon.svg" alt="" width="28" height="28" decoding="async">
      <span class="ib-vertical-brand__word">isteBul</span>
      <span class="ib-vertical-brand__badge">GarsonAI</span>
    </a>
    <nav aria-label="GarsonAI navigasyonu">
      <div class="ib-vertical-nav-primary">
        <a href="/garson/">Ana sayfa</a>
        <a href="/garson/demo/">Demo</a>
      </div>
    </nav>
  </header>

  <main class="vacation-container garson-admin-main">
    <section class="garson-admin-login" aria-labelledby="garson-admin-login-title">
      <p class="garson-admin-login__eyebrow">Restoran yönetimi</p>
      <h1 id="garson-admin-login-title" class="garson-admin-login__title">GarsonAI panele giriş</h1>
      <p class="garson-admin-login__lead">
        E-posta ve şifrenizle giriş yapın. Supabase Auth entegrasyonu için hazır arayüz.
      </p>

      <form id="garson-admin-login-form" class="garson-admin-login-form" novalidate>
        <div class="garson-admin-login-form__field">
          <label for="garson-admin-email">E-posta</label>
          <input id="garson-admin-email" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="garson-admin-login-form__field">
          <label for="garson-admin-password">Şifre</label>
          <input id="garson-admin-password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="vacation-btn vacation-btn--primary garson-admin-login-form__submit">
          Giriş yap
        </button>
      </form>

      <p id="garson-admin-login-notice" class="garson-admin-login__notice" hidden role="status" aria-live="polite"></p>

      <div class="garson-admin-login__demo">
        <p>Canlı auth olmadan denemek için demo giriş kullanın.</p>
        <button type="button" class="vacation-btn vacation-btn--secondary" id="garson-admin-demo-login">
          Demo giriş
        </button>
      </div>
    </section>
  </main>
</body>
</html>
