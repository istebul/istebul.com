<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Yapay zeka destekli ilanlar iç test paneli — herkese açık değil">
  <title>Yapay Zeka Destekli İlanlar Admin (İç) | isteBul</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/css/admin-ai-listings.css?v=1">
  <script src="/env.js" defer></script>
  <script type="module" src="/js/admin/ai-listings-admin.js"></script>
</head>
<body class="ai-listings-admin">
  <header class="ai-listings-admin__header">
    <h1>Yapay Zeka Destekli İlanlar — İç Test Paneli</h1>
    <p class="ai-listings-admin__subtitle">Herkese açık değil. Yalnızca localStorage ile açıkça etkinleştirildiğinde görünür.</p>
  </header>

  <main id="ai-listings-admin-root" class="ai-listings-admin__main">
    <div id="ai-listings-secret-warning" class="ai-listings-admin__warning" hidden></div>
    <p id="ai-listings-status" class="ai-listings-admin__status" aria-live="polite"></p>

    <div class="ai-listings-admin__grid">
      <section class="ai-listings-admin__panel">
        <h2>İlan oluştur</h2>
        <form id="ai-listings-create-form" class="ai-listings-admin__form">
          <label>
            Kategori
            <input id="ai-listings-create-category" name="category" required placeholder="vehicle">
          </label>
          <label>
            Başlık
            <input id="ai-listings-create-title" name="title" required>
          </label>
          <label>
            Açıklama
            <textarea id="ai-listings-create-description" name="description" rows="3"></textarea>
          </label>
          <label>
            Fiyat
            <input id="ai-listings-create-price" name="price" type="number" min="0" step="1">
          </label>
          <label>
            Para birimi
            <input id="ai-listings-create-currency" name="currency" value="TRY">
          </label>
          <label>
            Kaynak URL (http/https)
            <input id="ai-listings-create-source-url" name="source_url" type="url">
          </label>
          <label>
            Özellikler JSON
            <textarea id="ai-listings-create-attributes" name="attributes" rows="4" placeholder='{"year":2020}'></textarea>
          </label>
          <button type="submit" class="ai-listings-admin__btn">İlan oluştur</button>
        </form>
      </section>

      <section class="ai-listings-admin__panel">
        <div class="ai-listings-admin__panel-head">
          <h2>İlanlar</h2>
          <button type="button" id="ai-listings-refresh-list-btn" class="ai-listings-admin__btn ai-listings-admin__btn--ghost">Yenile</button>
        </div>
        <div class="ai-listings-admin__filters">
          <div id="ai-listings-status-filters" class="ai-listings-admin__chips" aria-label="Durum filtresi"></div>
          <input id="ai-listings-filter-category" placeholder="kategori">
          <input id="ai-listings-filter-source" placeholder="kaynak_tipi">
          <input id="ai-listings-filter-limit" type="number" min="1" max="100" placeholder="limit">
        </div>
        <div id="ai-listings-list" class="ai-listings-admin__list"></div>
      </section>

      <section class="ai-listings-admin__panel ai-listings-admin__panel--wide">
        <h2>Toplu içe aktarım</h2>
        <p class="ai-listings-admin__warning-inline">Sadece iç admin içe aktarımıdır. Yayına alma kapalıdır.</p>
        <div class="ai-listings-admin__form">
          <label>
            Format
            <select id="ai-listings-import-format">
              <option value="csv">CSV</option>
              <option value="json">JSON</option>
            </select>
          </label>
          <label>
            CSV / JSON içeriği
            <textarea id="ai-listings-import-content" rows="8" placeholder="category,title,description,price,currency,location,source_url,images,attributes"></textarea>
          </label>
          <label class="ai-listings-admin__checkbox">
            <input id="ai-listings-import-analyze" type="checkbox">
            İçe aktarımdan sonra deterministik analiz çalıştır
          </label>
          <div class="ai-listings-admin__actions">
            <button type="button" id="ai-listings-import-preview-btn" class="ai-listings-admin__btn ai-listings-admin__btn--ghost">Önizleme</button>
            <button type="button" id="ai-listings-import-run-btn" class="ai-listings-admin__btn" disabled>Geçerli satırları içe aktar</button>
          </div>
          <div id="ai-listings-import-preview" class="ai-listings-admin__import-preview-wrap"></div>
        </div>
      </section>

      <section class="ai-listings-admin__panel ai-listings-admin__panel--wide">
        <h2>İlan detayı</h2>
        <div id="ai-listings-detail" class="ai-listings-admin__detail">
          <p class="ai-listings-admin__muted">Detay, analiz ve olayları görmek için bir ilan seçin.</p>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
